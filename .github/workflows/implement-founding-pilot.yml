name: Implement founding pilot lane
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'backend/src'
          printf '%s' '' | base64 -d | gzip -d > 'backend/src/pilots.js'
          mkdir -p 'backend/src'
          printf '%s' '' | base64 -d | gzip -d > 'backend/src/worker.js'
          mkdir -p 'backend'
          printf '%s' '' | base64 -d | gzip -d > 'backend/test.mjs'
      - name: Run full repository suite
        run: bash test.sh
      - name: Verify backend parse and focused suite
        run: |
          node --check backend/src/pilots.js
          node --check backend/src/worker.js
          node backend/test.mjs
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/pilots.js backend/src/worker.js backend/test.mjs
          git commit -m "Add fail-closed founding pilot lane"
          git push origin HEAD:main
