name: Fix founding pilot free enablement
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > 'backend/src/pilots.js'
          printf '%s' '' | base64 -d | gzip -d > 'backend/test.mjs'
      - name: Run full repository suite
        run: bash test.sh
      - name: Verify focused suite
        run: |
          node --check backend/src/pilots.js
          node backend/test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/pilots.js backend/test.mjs
          git commit -m "Fix free pilot enablement boundary"
          git push origin HEAD:main
