name: Release Mac app

# Builds the FreeCoffee macOS menu bar app on a real macOS runner.
# - Push a tag like v1.0.1 → attaches FreeCoffee.dmg + SHA256SUMS.txt to a GitHub Release
# - Run manually (Actions tab) → saved as workflow artifacts
#
# $0 APPLE FEE — free distribution is the supported path: the build is
# ad-hoc signed (see app/build.sh); users get the one-time "Open Anyway"
# step (app/Info-howto.md) and checksum-verified downloads. The existing
# "Bump Homebrew tap" workflow consumes FreeCoffee.dmg from this Release.
# (Release step uses the official gh CLI — no third-party actions.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (universal arm64 + x86_64 → .app → .dmg)
        working-directory: app
        run: ./build.sh 2>&1 | tee build.log

      - name: Push build log for triage (only on failure)
        if: failure()
        working-directory: app
        run: |
          git config user.email "ci@freecoffee.tech"
          git config user.name "FreeCoffee CI"
          git checkout -B ci-log
          git add build.log
          git commit -m "ci: build log for triage"
          git push -q -f origin ci-log || true

      - name: SHA256 checksums
        working-directory: app
        run: |
          cd dist
          shasum -a 256 FreeCoffee.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: freecoffee-mac-${{ github.sha }}
          path: |
            app/dist/FreeCoffee.dmg
            app/dist/SHA256SUMS.txt

      - name: Attach to GitHub Release (tag runs)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        working-directory: app/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "FreeCoffee ${GITHUB_REF_NAME}" \
            --notes "FreeCoffee for macOS — menu bar app. Ad-hoc signed ($0 distribution): first launch → right-click → Open, or System Settings → Privacy & Security → Open Anyway. Verify with SHA256SUMS.txt." \
            --verify-tag || true
          gh release upload "${GITHUB_REF_NAME}" FreeCoffee.dmg SHA256SUMS.txt --clobber
          echo "Release ${GITHUB_REF_NAME} ready."
