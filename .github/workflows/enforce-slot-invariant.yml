name: Enforce sponsor slot invariant
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write invariant
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > 'backend/src/pilots.js'
          printf '%s' '' | base64 -d | gzip -d > 'backend/test.mjs'
      - name: Test backend invariant
        run: |
          node --check backend/src/pilots.js
          node backend/test.mjs
      - name: Commit invariant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/pilots.js backend/test.mjs
          git commit -m "Keep sponsor slot alive with demo fallback"
          git push origin HEAD:main
